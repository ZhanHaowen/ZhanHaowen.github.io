* { box-sizing:border-box; }
html { scroll-behavior:smooth; scroll-padding-top:65px; -webkit-text-size-adjust:100%; }
body { margin:0; }
button,a { -webkit-tap-highlight-color:transparent; }
button { font:inherit; }
button:focus-visible,a:focus-visible { outline:3px solid #8bb5d3; outline-offset:3px; }
::selection { background:#d9eafa; color:#183f60; }
[hidden] { display:none!important; }
.academic-homepage { --ink:#193d5c; --blue:#246398; --soft-blue:#edf4fa; --muted:#70808b; --line:#e5ebf0; font-size:14px; line-height:1.75; overflow-wrap:break-word; }
.academic-homepage a { color:var(--blue); text-decoration:none; }
.academic-homepage a:hover { color:#153e60; text-decoration:underline; text-underline-offset:3px; }
.site-container { width:min(100%,960px); padding:0 26px; margin:0 auto; }
.skip-link { position:fixed; left:16px; top:-80px; padding:8px 14px; z-index:30; background:#fff; border:1px solid var(--line); border-radius:5px; }
.skip-link:focus { top:12px; }
.academic-masthead { padding:31px 0 27px; background:linear-gradient(130deg,#f4f8fc 0%,#eef5fb 40%,#f9fbfe 72%,#fff 100%); border-top:3px solid #244e70; }
.masthead-inner { display:flex; gap:28px; align-items:center; }
.profile-avatar { display:block; flex-shrink:0; width:128px; height:128px; border-radius:50%; object-fit:cover; object-position:center 35%; border:4px solid #fff; box-shadow:0 3px 14px #244b6c16; background:#e4eef6; }
.avatar-placeholder { display:flex; align-items:center; justify-content:center; color:#6b8daa; font-family:Georgia,"Times New Roman",serif; font-size:35px; letter-spacing:2px; }
.profile-intro { min-width:0; }
.profile-intro h1 { color:#173b58; margin:0 0 5px; font-size:30px; font-weight:700; letter-spacing:-.7px; line-height:1.35; }
.profile-chinese { font-size:.7em; font-weight:500; letter-spacing:1px; margin-left:7px; white-space:nowrap; }
.profile-role { margin:0; font-size:15px; font-weight:500; color:#3e586b; }
